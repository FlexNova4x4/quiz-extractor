name: Quiz Extractor Auto Restart

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      AUTHORIZED_USERS: ${{ secrets.AUTHORIZED_USERS }}
      TG_SESSION_PATH: ${{ github.workspace }}/telegram_session

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Validate secrets
        run: |
          test -n "$TG_API_ID"
          test -n "$TG_API_HASH"
          test -n "$TG_BOT_TOKEN"
          test -n "$AUTHORIZED_USERS"

      - name: Restore Telegram session
        env:
          TG_SESSION_PASSPHRASE: ${{ secrets.TG_SESSION_PASSPHRASE }}
        run: |
          test -n "$TG_SESSION_PASSPHRASE"
          printf '%s\n' "$TG_SESSION_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --output telegram_session.session \
            --decrypt telegram_session.session.gpg
          chmod 600 telegram_session.session

      - name: Run bot for 5 hours 50 minutes
        run: |
          set +e
          timeout --signal=INT --kill-after=30s \
            21000s python -c 'import logging,runpy; logging.getLogger("httpx").setLevel(logging.WARNING); runpy.run_path("bot_interface.py",run_name="__main__")'
          status=$?

          if [ "$status" -eq 124 ] || \
             [ "$status" -eq 130 ] || \
             [ "$status" -eq 137 ] || \
             [ "$status" -eq 0 ]; then
            exit 0
          fi

          exit "$status"

  restart:
    needs: run-bot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Wait 20 minutes
        run: sleep 1200

      - name: Trigger next runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quiz-extractor.yml/dispatches" \
            -d '{"ref":"main"}'
